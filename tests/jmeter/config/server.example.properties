# Copy to server.properties (not committed: see .gitignore) and fill in for the server run.
# Load it after local.properties so only these keys change:
#   .\scripts\run-verifyphoto-test.ps1 -Config config\local.properties,config\server.properties -ApiOnThisMachine:$false
#
# Run JMeter on a separate machine close to the server (same region or network), not
# on the API server itself, so the load generator does not take CPU from the API.
API_HOST=203.0.113.10
API_PORT=7006
# The face image on the JMeter machine (forward slashes).
IMAGE_PATH=C:/loadtest/images/face.jpg
# Network round trips add latency; allow more requests in flight.
MAX_IN_FLIGHT=60
