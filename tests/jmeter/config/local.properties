# =============================================================================
# verifyPhoto stress test: API on this PC (http://localhost:7006)
# =============================================================================
# Passed to JMeter with -q. Each key overrides the default of the same-named setting
# in verifyphoto_stress_test.jmx. Java properties format: write Windows paths with
# forward slashes (C:/data/face.jpg); a backslash is an escape character here.
# Never put passwords or tokens in this file; the API has no authentication today.

# --- Target --------------------------------------------------------------------
PROTOCOL=http
API_HOST=localhost
API_PORT=7006
API_PATH=/verifyPhoto
LICENSE_CHECK_PATH=/checkLicense

# --- Request ---------------------------------------------------------------------
UPLOAD_FIELD_NAME=file
# Relative paths start at the folder holding the .jmx.
IMAGE_PATH=../../deploy/samples/face.jpg
IMAGE_MIME_TYPE=image/jpeg
# Empty: every response must have the verdict of the baseline request.
EXPECTED_MESSAGE=
STRICT_BODY_MATCH=true

# --- Load profile: 2 min linear ramp 1 -> 10 TPS, then 13 min at 10 TPS = 15 min ----
TARGET_TPS=10
RAMP_START_TPS=1
RAMP_UP_SECONDS=120
SUSTAIN_SECONDS=780
MAX_IN_FLIGHT=40
HARD_MAX_SECONDS=1200

# --- Timeouts ---------------------------------------------------------------------
CONNECT_TIMEOUT_MS=5000
RESPONSE_TIMEOUT_MS=30000

# --- Safety stops inside JMeter (see README.md, "Safety limits") ------------------
ERROR_RATE_PERCENT=5
ERROR_WINDOW=100
ERROR_MIN_SAMPLES=30
MAX_CONSECUTIVE_FAILURES=5
MAX_TIMEOUTS_IN_WINDOW=3
SLOW_RESPONSE_MS=10000
MAX_CONSECUTIVE_SLOW=5
MAX_SCHEDULE_LAG_MS=5000
MAX_BAD_VERDICTS=3
