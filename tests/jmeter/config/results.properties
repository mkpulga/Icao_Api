# Results file (JTL) and HTML dashboard settings. Always passed by run-verifyphoto-test.ps1.

# CSV results with the columns the dashboard and summarize-results.ps1 need.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
# timeStamp = when the request started (completion = timeStamp + elapsed).
sampleresult.timestamp.start=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=false
# Never store bodies: each verifyPhoto response is ~4 MB.
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=false
jmeter.save.saveservice.samplerData=false
# Values set per request by the plan, saved as extra columns.
sample_variables=PHASE,TARGET_TPS_NOW,DUE_MS,LAG_MS,VERDICT,FAIL_CLASS

# Keep each thread's connection open between requests (fewer TCP handshakes for the
# load generator; the API sees the same work per request either way).
httpclient.reset_state_on_thread_group_iteration=false

# Console progress line every 30 s.
summariser.interval=30

# Dashboard: 10 s points on the over-time graphs, percentiles 90/95/99.
jmeter.reportgenerator.overall_granularity=10000
jmeter.reportgenerator.report_title=obsIcaoApi verifyPhoto stress test
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99
